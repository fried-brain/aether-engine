<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">AETHER ENGINE — Build worlds beyond imagination</title>
  <desc id="desc">A cinematic twilight fantasy landscape with distant mountains, a luminous orbital A emblem, and the AETHER ENGINE name.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162b"/><stop offset=".48" stop-color="#102c50"/><stop offset="1" stop-color="#030914"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1a16b" stop-opacity=".7"/><stop offset=".5" stop-color="#38618a" stop-opacity=".22"/><stop offset="1" stop-color="#07101e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45617e"/><stop offset="1" stop-color="#091425"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#a9e5ff"/><stop offset="1" stop-color="#278bff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vignette"><stop offset=".35" stop-color="#020916" stop-opacity="0"/><stop offset="1" stop-color="#020916" stop-opacity=".9"/></radialGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#sky)"/>
  <rect y="250" width="1600" height="430" fill="url(#horizon)"/>
  <g fill="#d9edff" opacity=".75">
    <circle cx="130" cy="94" r="2"/><circle cx="260" cy="155" r="1.5"/><circle cx="410" cy="72" r="2"/><circle cx="550" cy="190" r="1.4"/><circle cx="1050" cy="92" r="2"/><circle cx="1220" cy="155" r="1.5"/><circle cx="1450" cy="75" r="2"/><circle cx="1510" cy="215" r="1.5"/><circle cx="930" cy="215" r="1.2"/><circle cx="720" cy="90" r="1.5"/>
  </g>
  <circle cx="1320" cy="135" r="74" fill="#c9dff5" opacity=".7"/><circle cx="1345" cy="112" r="74" fill="#102a49"/>
  <path d="M0 510 L160 350 L270 475 L430 290 L600 500 L760 345 L900 510 L1070 330 L1210 495 L1390 310 L1600 520 L1600 800 L0 800Z" fill="url(#mountain)" opacity=".9"/>
  <path d="M0 590 L190 465 L360 570 L550 410 L730 610 L940 455 L1110 600 L1310 430 L1480 590 L1600 500 L1600 800 L0 800Z" fill="#09172a"/>
  <path d="M0 665 C260 610 370 720 610 665 S1020 600 1260 680 S1480 660 1600 620 L1600 800 L0 800Z" fill="#040c18"/>
  <g opacity=".65" fill="#18344d">
    <path d="M1320 520 L1320 330 L1350 330 L1350 270 L1380 270 L1380 215 L1410 215 L1410 280 L1440 280 L1440 340 L1470 340 L1470 520Z"/>
    <path d="M1400 220 L1400 170 L1415 140 L1430 170 L1430 220Z"/>
    <path d="M1460 300 L1460 250 L1475 220 L1490 250 L1490 300Z"/>
  </g>
  <g transform="translate(800 260)" filter="url(#glow)">
    <path d="M0 -122 L-122 130 L-73 130 L0 -24 L75 130 L124 130 Z" fill="url(#ice)" stroke="#e9f8ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-175 72 C-70 36 72 58 190 -28 C224 -52 243 -76 246 -101" fill="none" stroke="url(#ice)" stroke-width="11" stroke-linecap="round"/>
    <path d="M-175 72 C-70 36 72 58 190 -28 C224 -52 243 -76 246 -101" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M246 -128 L252 -105 L275 -99 L252 -93 L246 -70 L240 -93 L217 -99 L240 -105Z" fill="#fff"/>
  </g>
  <text x="800" y="505" fill="#f6fbff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="500" letter-spacing="20" text-anchor="middle">AETHER ENGINE</text>
  <text x="800" y="570" fill="#b9d5ef" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="5" text-anchor="middle">A MODERN, OPEN-SOURCE 3D GAME ENGINE</text>
  <path d="M480 605 H1120" stroke="#4cbcff" stroke-width="2" opacity=".7"/>
  <text x="800" y="660" fill="#e4f5ff" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3" text-anchor="middle">RENDER  ·  SIMULATE  ·  CREATE  ·  EXPLORE</text>
  <rect width="1600" height="800" fill="url(#vignette)"/>

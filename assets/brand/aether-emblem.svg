<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">AETHER ENGINE emblem</title>
  <desc id="desc">A luminous geometric A wrapped by a blue orbital ring and star.</desc>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#d8f0ff"/>
      <stop offset=".72" stop-color="#72caff"/>
      <stop offset="1" stop-color="#f8fdff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".48" stop-color="#e6f8ff"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="450" cy="420" r="305" fill="none" stroke="#1478d8" stroke-width="3" opacity=".32"/>
  <path d="M450 115 C640 116 786 263 766 451 C750 600 633 714 486 728" fill="none" stroke="url(#orbit)" stroke-width="7" opacity=".95" filter="url(#glow)"/>
  <path d="M450 145 L190 690 L292 690 L450 365 L610 690 L712 690 Z" fill="url(#ice)" stroke="#f7fdff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M350 565 L550 565 L603 657 L297 657 Z" fill="#06162d" opacity=".96"/>
  <path d="M120 590 C290 520 490 525 680 425 C744 392 785 353 793 308" fill="none" stroke="url(#orbit)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M120 590 C290 520 490 525 680 425 C744 392 785 353 793 308" fill="none" stroke="#f5fcff" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(795 305)" filter="url(#glow)">
    <path d="M0 -54 L8 -8 L54 0 L8 8 L0 54 L-8 8 L-54 0 L-8 -8 Z" fill="#ffffff"/>
    <circle r="9" fill="#ffffff"/>
  </g>
</svg>